receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Add/modify resource-level attributes (applies to traces, metrics, and logs)
  resource:
    attributes:
      - key: deployment.environment.name
        value: local
        action: insert
      - key: host.arch
        action: delete
      - key: host.id
        action: delete
      - key: host.name
        action: delete
      - key: process.command
        action: delete
      - key: process.command_args
        action: delete
      - key: process.executable.path
        action: delete
      - key: process.owner
        action: delete
      - key: process.pid
        action: delete

  # Modify span attributes (for traces)
  attributes/traces:
    actions:
      - key: http.user_agent
        action: delete
      - key: net.host.ip
        action: delete
      - key: net.peer.ip
        action: delete
      - key: net.host.port
        action: delete
      - key: net.peer.port
        action: delete

  # Modify metric datapoint attributes (for metrics)
  attributes/metrics:
    actions:
      - key: net.host.port
        action: delete

  # Filter out unwanted metrics to reduce cardinality
  filter/exclude_metrics:
    error_mode: ignore
    metrics:
      metric:
        # Drop a low-level V8 internal metric most apps don't need.
        # The per-heap-space physical size is deep engine detail. The
        # useful memory signals (v8js.memory.heap.used / heap.limit) stay.
        - 'name == "v8js.memory.heap.space.physical_size"'

  # Rename and transform metrics
  metricstransform:
    transforms:
      # Rename the HTTP duration metric to match the current OTel
      # semantic conventions (http.server.duration -> http.server.request.duration)
      - include: http.server.duration
        action: update
        new_name: http.server.request.duration

  # Rewrite log records with OTTL (for logs).
  # Rolling a 1 is our "losing" roll, so we raise it from INFO to WARN.
  # This makes the noteworthy events stand out and sets up the filter below.
  transform/logs:
    error_mode: ignore
    log_statements:
      - context: log
        statements:
          - set(log.severity_number, SEVERITY_NUMBER_WARN) where log.attributes["dice.value"] == 1
          - set(log.severity_text, "WARN") where log.attributes["dice.value"] == 1

  # Drop low-severity log noise (for logs).
  # Keep only WARN and above so routine INFO rolls don't fill up storage.
  # The filter processor drops any record that matches the condition.
  filter/logs:
    error_mode: ignore
    logs:
      log_record:
        - 'log.severity_number < SEVERITY_NUMBER_WARN'

  # Batch for efficient export (traces + metrics)
  batch:
    timeout: 5s
    send_batch_size: 512

exporters:
  debug:
    verbosity: detailed

  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

  prometheus:
    endpoint: 0.0.0.0:8889

  # OpenSearch stores our logs. Batching for logs is handled here at the
  # exporter level (sending_queue.batch) instead of a standalone batch
  # processor. This is the modern replacement the Collector is moving toward.
  opensearch:
    http:
      endpoint: http://opensearch:9200
    logs_index: otel-logs
    sending_queue:
      sizer: items
      batch:
        flush_timeout: 5s
        min_size: 512

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [resource, attributes/traces, batch]
      exporters: [debug, otlp/jaeger]
    metrics:
      receivers: [otlp]
      processors: [resource, filter/exclude_metrics, attributes/metrics, metricstransform, batch]
      exporters: [debug, prometheus]
    logs:
      receivers: [otlp]
      processors: [resource, transform/logs, filter/logs]
      exporters: [debug, opensearch]
