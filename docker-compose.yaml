services:
  jaeger:
    image: jaegertracing/all-in-one:1.69.0
    ports:
      - "16686:16686"   # Jaeger UI
      - "14250:14250"   # Jaeger grpc (optional)
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      COLLECTOR_OTLP_GRPC_PORT: 4317

  prometheus:
    image: prom/prometheus:v3.11.3
    volumes:
      - ./otel/prometheus.yaml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"     # Prometheus UI
    depends_on:
      - otel-collector

  opensearch:
    image: opensearchproject/opensearch:3.6.0
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true        # no TLS/auth for local learning
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"     # OpenSearch REST API
      - "9600:9600"     # Performance Analyzer

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:3.6.0
    environment:
      - 'OPENSEARCH_HOSTS=["http://opensearch:9200"]'
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    ports:
      - "5601:5601"     # OpenSearch Dashboards UI
    depends_on:
      - opensearch

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.161.0
    volumes:
      - ./otel/otel-collector-config.yaml:/etc/otelcol/config.yaml
    command: ["--config", "/etc/otelcol/config.yaml"]
    ports:
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP
      - "8889:8889"     # Prometheus metrics endpoint
    depends_on:
      - jaeger
      - opensearch
